version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: panafri
      POSTGRES_PASSWORD: panafri_pass
      POSTGRES_DB: panafri_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panafri -d panafri_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
